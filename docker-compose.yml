services:
  prody:
    build: .
    container_name: prody
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    # Or set variables directly (Coolify does this via dashboard):
    # environment:
    #   - NEXT_PUBLIC_SUPABASE_URL=
    #   - NEXT_PUBLIC_SUPABASE_ANON_KEY=
    #   - SUPABASE_SERVICE_ROLE_KEY=
    #   - DATABASE_URL=
    #   - CRON_SECRET=
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
